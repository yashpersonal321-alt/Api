<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Overlay</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: rgba(14, 22, 33, 0.95); /* Semi-transparent look */
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #status {
            font-size: 22px;
            margin-bottom: 40px;
            color: #2481cc;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }

        /* Bada Mic Button */
        .mic-btn {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #2481cc, #11538c);
            border: 5px solid #ffffff;
            border-radius: 50%;
            font-size: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(36, 129, 204, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .mic-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 40px rgba(36, 129, 204, 1);
        }

        /* Bada Cancel Button */
        .cancel-btn {
            margin-top: 50px;
            width: 90px;
            height: 90px;
            background: #d9534f;
            border: none;
            border-radius: 50%;
            font-size: 28px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(217, 83, 79, 0.5);
        }

        .cancel-btn:active {
            transform: scale(0.9);
        }

        /* Pulse Animation jab agent sun raha ho */
        .listening {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(36, 129, 204, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(36, 129, 204, 0); }
            100% { box-shadow: 0 0 0 0 rgba(36, 129, 204, 0); }
        }
    </style>
</head>
<body>

    <div id="status">Jarvis is listening, sir...</div>

    <!-- Bada Mic Button -->
    <button class="mic-btn listening" id="micBtn" onclick="startListening()">🎙️</button>

    <!-- Bada Cancel Button -->
    <button class="cancel-btn" onclick="closeAgent()">✖</button>

    <script>
        const contacts = {
            "vivek": "9992074369",
            "suraj": "7988045288",
            "sunil": "8930068400",
            "papa": "9728476566"
        };

        // --- SPEECH RECOGNITION (BOLNE WALI FEATURE) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; // Commands English me pehchanega

            recognition.onresult = function(event) {
                const resultText = event.results[0][0].transcript;
                document.getElementById('status').innerText = `You said: "${resultText}"`;
                processVoiceCommand(resultText);
            };

            recognition.onerror = function() {
                document.getElementById('status').innerText = "Didn't catch that. Tap Mic to try again.";
                document.getElementById('micBtn').classList.remove('listening');
            };

            recognition.onend = function() {
                document.getElementById('micBtn').classList.remove('listening');
            };
        } else {
            alert("Sir, aapka browser voice recognition support nahi karta.");
        }

        // Auto-start listening jab app khule
        window.onload = function() {
            startListening();
        };

        function startListening() {
            if (!recognition) return;
            document.getElementById('status').innerText = "Listening, sir...";
            document.getElementById('micBtn').classList.add('listening');
            recognition.start();
        }

        // --- TEXT TO SPEECH ---
        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = text.includes("Calling") ? 'en-US' : 'hi-IN';
            window.speechSynthesis.speak(speech);
        }

        function processVoiceCommand(voiceInput) {
            let cmd = voiceInput.toLowerCase().trim();

            // Calling Logic
            if (cmd.startsWith('call ')) {
                let name = cmd.replace('call ', '').trim();
                let number = contacts[name] || name;
                let formattedName = name.charAt(0).toUpperCase() + name.slice(1);
                
                speak(`Calling to ${formattedName} for you sir`);
                
                setTimeout(() => {
                    window.location.href = `tel:${number}`;
                }, 2000);
            }
            // App Opening
            else if (cmd.includes('open youtube')) {
                speak("Opening YouTube, sir.");
                setTimeout(() => { window.open('https://youtube.com', '_blank'); }, 1000);
            }
            else if (cmd.includes('open instagram')) {
                speak("Opening Instagram, sir.");
                setTimeout(() => { window.open('https://instagram.com', '_blank'); }, 1000);
            }
            else {
                speak("Command not recognized, sir.");
                document.getElementById('status').innerText = "Command not recognized.";
            }
        }

        function closeAgent() {
            speak("Goodbye, sir.");
            // Browser security page ko direct close nahi karne deti, toh hum ise blank kar dete hain ya go back kar dete hain
            document.getElementById('status').innerText = "Exiting...";
            setTimeout(() => {
                window.history.back();
            }, 500);
        }
    </script>
</body>
</html>
