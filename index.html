<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaadein AI - Karodon ki App</title>
    <style>
        :root {
            --primary: #5d4037;
            --accent: #ff5252;
            --bg: #fdf6e3;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--primary);
        }

        .app-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .question-box {
            background: #fff9eb;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid var(--accent);
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #resultText {
            min-height: 120px;
            border: 2px dashed #d7ccc8;
            padding: 15px;
            margin: 20px 0;
            border-radius: 12px;
            background: #fafafa;
            text-align: left;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-mic {
            background: var(--accent);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .btn-ai { background: #E91E63; color: white; width: 100%; }
        .btn-next { background: #8d6e63; color: white; flex: 1; }
        
        .recording-active {
            animation: pulse 1.5s infinite;
            background: #4caf50 !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .status { font-size: 0.9rem; margin-top: 10px; color: #795548; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>Yaadein AI 🎙️</h1>
    <p>Har yaad ek anmol tohfa hai.</p>

    <div class="question-box" id="qBox">
        Dada ji, aapki pehli kamai kya thi aur aapne uska kya kiya?
    </div>

    <div id="resultText">Jo aap bolenge, wo yahan likha jayega...</div>

    <div class="controls">
        <button class="btn btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>
        <button class="btn btn-ai" onclick="askAI()">✨ AI Kahani Banayein</button>
        <button class="btn btn-next" onclick="newQuestion()">Agla Sawal</button>
    </div>

    <div class="status" id="statusLabel">Start karne ke liye mic dabayein</div>
</div>

<script>
    // --- SETTINGS ---
    const API_KEY = "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";
    let isRecording = false;
    let recognition;

    // --- VOICE RECOGNITION SETUP ---
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let finalStr = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) finalStr += event.results[i][0].transcript;
            }
            if(finalStr) document.getElementById('resultText').innerText = finalStr;
        };

        recognition.onend = () => { stopUi(); };
    }

    function toggleMic() {
        if (!isRecording) {
            recognition.start();
            isRecording = true;
            document.getElementById('micBtn').classList.add('recording-active');
            document.getElementById('statusLabel').innerText = "Main sun raha hoon...";
        } else {
            recognition.stop();
            stopUi();
        }
    }

    function stopUi() {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording-active');
        document.getElementById('statusLabel').innerText = "Recording saved!";
    }

    // --- AI LOGIC (OpenRouter) ---
    async function askAI() {
        const userText = document.getElementById('resultText').innerText;
        const status = document.getElementById('statusLabel');

        if(userText.length < 5) return alert("Pehle kuch record karein!");

        status.innerText = "AI kahani likh raha hai... ✍️";
        
        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "google/gemini-pro-1.5",
                    "messages": [
                        {"role": "system", "content": "You are a professional biographer. Convert the user's raw memories into a beautiful, heart-touching short story in Hindi."},
                        {"role": "user", "content": userText}
                    ]
                })
            });

            const data = await response.json();
            const story = data.choices[0].message.content;
            document.getElementById('resultText').innerHTML = "<strong>Kahani:</strong><br>" + story;
            status.innerText = "Wow! Kya kahani hai!";
        } catch (e) {
            status.innerText = "AI connect nahi ho paya.";
            console.error(e);
        }
    }

    function newQuestion() {
        const qs = [
            "Aapka pehla school kaisa tha?",
            "Bachpan ki sabse badi shararat?",
            "Pehli baar cinema kab dekha?",
            "Gaon ki wo kaunsi cheez hai jo aap bahut miss karte hain?"
        ];
        document.getElementById('qBox').innerText = qs[Math.floor(Math.random()*qs.length)];
        document.getElementById('resultText').innerText = "Jo aap bolenge, wo yahan likha jayega...";
    }
</script>

</body>
</html>
